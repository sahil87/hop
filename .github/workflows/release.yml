name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # workflow_dispatch must run from main; tag-push is allowed from any ref.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Create tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: create_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./scripts/release.sh "${{ inputs.bump }}"
          echo "tag=$(git tag --sort=-v:refname | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ steps.create_tag.outputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile
        working-directory: src
        run: |
          mkdir -p ../dist
          targets="darwin/arm64 darwin/amd64 linux/arm64 linux/amd64"
          for target in $targets; do
            os="${target%/*}"
            arch="${target#*/}"
            output="hop-${os}-${arch}"
            echo "Building ${output}..."
            mkdir -p "../dist/${output}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags "-X main.version=${{ steps.version.outputs.tag }}" \
              -o "../dist/${output}/hop" ./cmd/hop
            tar -czf "../dist/${output}.tar.gz" -C "../dist/${output}" hop
          done

      - name: Publish help reference to shll.ai
        env:
          SHLLAI_TOKEN: ${{ secrets.SHLLAI_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # 1. Dump the help tree from the freshly built, version-stamped binary
          #    (the producer leaves captured_at empty).
          ./dist/hop-linux-amd64/hop help-dump > /tmp/hop.raw.json
          # 2. Inject a date-floored UTC captured_at (matches the wt.json convention).
          captured_at=$(date -u +%Y-%m-%dT00:00:00Z)
          jq --arg t "$captured_at" '.captured_at=$t' /tmp/hop.raw.json > /tmp/hop.json
          # 3. Validate it parses and matches the contract (fail the release if malformed).
          jq -e '.tool=="hop" and .schema_version==1 and (.root|type=="object") and (.captured_at|test("Z$"))' /tmp/hop.json >/dev/null
          # 4. Clone shll.ai, drop the file on a fresh branch, open an auto-merge PR
          #    (PR not push-to-main, to avoid the multi-repo push race).
          git clone "https://x-access-token:${SHLLAI_TOKEN}@github.com/sahil87/shll.ai.git" /tmp/shllai
          cd /tmp/shllai
          branch="hop-help-${version}"
          git checkout -b "$branch"
          mkdir -p help
          cp /tmp/hop.json help/hop.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add help/hop.json
          # Nothing to publish if help/hop.json is unchanged (e.g. a workflow
          # re-run, or a release with no CLI-surface change). Exit cleanly so a
          # re-run can't be blocked by `git commit` failing on an empty commit.
          if git diff --cached --quiet; then
            echo "help/hop.json unchanged — nothing to publish, skipping PR."
            exit 0
          fi
          git commit -m "hop help reference v${version}"
          git push origin "$branch"
          GH_TOKEN="$SHLLAI_TOKEN" gh pr create --repo sahil87/shll.ai \
            --base main --head "$branch" \
            --title "hop help reference v${version}" \
            --body "Automated CLI help reference dump from hop v${version}."
          GH_TOKEN="$SHLLAI_TOKEN" gh pr merge --repo sahil87/shll.ai "$branch" --auto --squash

      - name: Determine release notes base tag
        id: release-base
        run: |
          tag="${{ steps.version.outputs.tag }}"
          # Extract major.minor from current tag (e.g. v0.2.0 → 0.2)
          current_minor=$(echo "$tag" | sed 's/^v//' | cut -d. -f1-2)
          patch=$(echo "$tag" | sed 's/^v//' | cut -d. -f3)

          if [ "$patch" = "0" ]; then
            # Minor version bump — find the first tag of the previous minor version
            major=$(echo "$current_minor" | cut -d. -f1)
            minor=$(echo "$current_minor" | cut -d. -f2)
            prev_minor=$((minor - 1))
            prev_prefix="v${major}.${prev_minor}."
            # Get the earliest tag matching the previous minor version
            base_tag=$(git tag -l "${prev_prefix}*" --sort=version:refname | head -1)
            if [ -n "$base_tag" ]; then
              echo "base_tag=$base_tag" >> "$GITHUB_OUTPUT"
              echo "Using base tag: $base_tag (minor version release)"
            else
              echo "No previous minor version tags found, using default"
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/*.tar.gz
          generate_release_notes: true
          previous_tag: ${{ steps.release-base.outputs.base_tag }}

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"

          sha_darwin_arm64=$(sha256sum dist/hop-darwin-arm64.tar.gz | cut -d' ' -f1)
          sha_darwin_amd64=$(sha256sum dist/hop-darwin-amd64.tar.gz | cut -d' ' -f1)
          sha_linux_arm64=$(sha256sum dist/hop-linux-arm64.tar.gz | cut -d' ' -f1)
          sha_linux_amd64=$(sha256sum dist/hop-linux-amd64.tar.gz | cut -d' ' -f1)

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/sahil87/homebrew-tap.git" /tmp/homebrew-tap

          sed \
            -e "s/VERSION_PLACEHOLDER/${version}/" \
            -e "s/SHA_DARWIN_ARM64/${sha_darwin_arm64}/" \
            -e "s/SHA_DARWIN_AMD64/${sha_darwin_amd64}/" \
            -e "s/SHA_LINUX_ARM64/${sha_linux_arm64}/" \
            -e "s/SHA_LINUX_AMD64/${sha_linux_amd64}/" \
            .github/formula-template.rb > /tmp/homebrew-tap/Formula/hop.rb

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/hop.rb
          git commit -m "hop v${version}"
          git push
