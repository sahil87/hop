name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # workflow_dispatch must run from main; tag-push is allowed from any ref.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Create tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: create_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./scripts/release.sh "${{ inputs.bump }}"
          echo "tag=$(git tag --sort=-v:refname | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ steps.create_tag.outputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile
        working-directory: src
        run: |
          mkdir -p ../dist
          targets="darwin/arm64 darwin/amd64 linux/arm64 linux/amd64"
          for target in $targets; do
            os="${target%/*}"
            arch="${target#*/}"
            output="hop-${os}-${arch}"
            echo "Building ${output}..."
            mkdir -p "../dist/${output}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags "-X main.version=${{ steps.version.outputs.tag }}" \
              -o "../dist/${output}/hop" ./cmd/hop
            tar -czf "../dist/${output}.tar.gz" -C "../dist/${output}" hop
          done

      - name: Determine release notes base tag
        id: release-base
        run: |
          tag="${{ steps.version.outputs.tag }}"
          # Extract major.minor from current tag (e.g. v0.2.0 → 0.2)
          current_minor=$(echo "$tag" | sed 's/^v//' | cut -d. -f1-2)
          patch=$(echo "$tag" | sed 's/^v//' | cut -d. -f3)

          if [ "$patch" = "0" ]; then
            # Minor version bump — find the first tag of the previous minor version
            major=$(echo "$current_minor" | cut -d. -f1)
            minor=$(echo "$current_minor" | cut -d. -f2)
            prev_minor=$((minor - 1))
            prev_prefix="v${major}.${prev_minor}."
            # Get the earliest tag matching the previous minor version
            base_tag=$(git tag -l "${prev_prefix}*" --sort=version:refname | head -1)
            if [ -n "$base_tag" ]; then
              echo "base_tag=$base_tag" >> "$GITHUB_OUTPUT"
              echo "Using base tag: $base_tag (minor version release)"
            else
              echo "No previous minor version tags found, using default"
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/*.tar.gz
          generate_release_notes: true
          previous_tag: ${{ steps.release-base.outputs.base_tag }}

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"

          sha_darwin_arm64=$(sha256sum dist/hop-darwin-arm64.tar.gz | cut -d' ' -f1)
          sha_darwin_amd64=$(sha256sum dist/hop-darwin-amd64.tar.gz | cut -d' ' -f1)
          sha_linux_arm64=$(sha256sum dist/hop-linux-arm64.tar.gz | cut -d' ' -f1)
          sha_linux_amd64=$(sha256sum dist/hop-linux-amd64.tar.gz | cut -d' ' -f1)

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/sahil87/homebrew-tap.git" /tmp/homebrew-tap

          sed \
            -e "s/VERSION_PLACEHOLDER/${version}/" \
            -e "s/SHA_DARWIN_ARM64/${sha_darwin_arm64}/" \
            -e "s/SHA_DARWIN_AMD64/${sha_darwin_amd64}/" \
            -e "s/SHA_LINUX_ARM64/${sha_linux_arm64}/" \
            -e "s/SHA_LINUX_AMD64/${sha_linux_amd64}/" \
            .github/formula-template.rb > /tmp/homebrew-tap/Formula/hop.rb

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/hop.rb
          git commit -m "hop v${version}"
          git push

      - name: Dump help tree and PR to shll.ai
        # Best-effort: this publishes the command reference downstream and must
        # never flip the release job red after the GitHub Release + Homebrew tap
        # steps have already succeeded. Merging is owned by shll.ai's
        # help-automerge.yml (gated on actor/content/schema) — we only open the PR.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SHLLAI_TOKEN }}   # sahil87 PAT: contents + pull-requests write on shll.ai
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          # 1. Dump the help tree from the stamped native binary (the producer
          #    leaves captured_at empty) and inject a date-floored UTC captured_at.
          mkdir -p help
          ./dist/hop-linux-amd64/hop help-dump > /tmp/hop.raw.json
          captured_at=$(date -u +%Y-%m-%dT00:00:00Z)
          jq --arg t "$captured_at" '.captured_at=$t' /tmp/hop.raw.json > help/hop.json

          # 2. Validate it parses and matches the contract (the authoritative
          #    schema gate lives in shll.ai's validate-help.mjs).
          jq -e '.tool=="hop" and .schema_version==1 and (.root|type=="object") and (.captured_at|test("Z$"))' help/hop.json >/dev/null

          # 3. Clone shll.ai and open a PR (PR, not push-to-main, to avoid the
          #    multi-repo push race). shll.ai's automerge workflow merges it.
          git clone "https://x-access-token:${GH_TOKEN}@github.com/sahil87/shll.ai.git" /tmp/shll-ai

          # No-op guard: skip when the only difference is the captured_at timestamp
          # (which changes every run), so re-running a release does not spam
          # downstream PRs with content-identical references. Compare both files
          # with the captured_at line stripped.
          strip_captured_at() { grep -v '"captured_at"' "$1"; }
          if [ -f /tmp/shll-ai/help/hop.json ] \
             && diff -q <(strip_captured_at help/hop.json) \
                        <(strip_captured_at /tmp/shll-ai/help/hop.json) >/dev/null; then
            echo "No substantive change to help/hop.json (only captured_at differs) — skipping PR"
            exit 0
          fi

          mkdir -p /tmp/shll-ai/help
          cp help/hop.json /tmp/shll-ai/help/hop.json
          cd /tmp/shll-ai
          branch="help-dump/hop-${version}"
          # Author as sahil87 to satisfy shll.ai's actor guard (TRUSTED_AUTHOR).
          git config user.name "sahil87"
          git config user.email "sahil@noon.design"
          git checkout -b "$branch"
          git add help/hop.json                       # only this file — content guard
          git commit -m "hop: update command reference (v${version})"
          git push -u origin "$branch"
          gh pr create --repo sahil87/shll.ai --base main --head "$branch" \
            --title "hop: command reference v${version}" \
            --body "Automated help-dump from sahil87/hop v${version}. Auto-merges via help-automerge.yml once the actor/content/schema guards pass."
          # NO `gh pr merge` here — shll.ai's help-automerge.yml owns merging.
